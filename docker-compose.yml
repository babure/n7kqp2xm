services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      CACHE_DIR: /app/backend/data/cache
      STATIC_DIR: /app/frontend/dist
      SKIP_COLD_REFRESH: "0"
      # Extend by changing these (see docs/EXTENDING.md)
      GRIDBRICKS_DELIVERY_FROM: "2026-01-01"
      GRIDBRICKS_DELIVERY_TO: "2026-01-31"
      GRIDBRICKS_LABEL: "Jan 2026 · GB wind"
    volumes:
      - cache-data:/app/backend/data/cache

volumes:
  cache-data:
