# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard: New → Blueprint → connect github.com/babure/n7kqp2xm
services:
  - type: web
    name: n7kqp2xm-wind
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: SKIP_COLD_REFRESH
        value: "0"
      - key: CORS_ORIGINS
        value: "*"
      # Optional: override analysis window without rebuilding
      # - key: GRIDBRICKS_DELIVERY_FROM
      #   value: "2026-01-01"
      # - key: GRIDBRICKS_DELIVERY_TO
      #   value: "2026-01-31"
      # - key: GRIDBRICKS_LABEL
      #   value: "Jan 2026 · GB wind"
